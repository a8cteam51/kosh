description: performance
config:
  - prompts: [performance]
    vars:
      environment: production
      note: ''
    options:
      # Grade only the report JSON (commentary can name a finding it chose not to raise); an unparseable answer fails instead of erroring.
      transform: '(() => { try { return JSON.parse([...output.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].at(-1)[1]); } catch { return output; } })()'
    assert:
      - type: skill-used
        value: performance
tests:
  - description: Third-party analytics console error on production is a low finding
    vars:
      rows: &analytics-rows |
        [
          {"url":"https://example.com/","redirectedFrom":[],"viewport":"1920x1080","status":200,"visits":1,"loadTime":612,"domContentLoaded":455,"ttfb":88,"transferSize":41210,"resourceTransferSize":684330,"lcp":540,"cls":0.01,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]},
          {"url":"https://example.com/about/","redirectedFrom":[],"viewport":"1920x1080","status":200,"visits":1,"loadTime":498,"domContentLoaded":362,"ttfb":71,"transferSize":36880,"resourceTransferSize":512904,"lcp":430,"cls":0,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]},
          {"url":"https://example.com/blog/hello-world/","redirectedFrom":[],"viewport":"1920x1080","status":200,"visits":1,"loadTime":655,"domContentLoaded":470,"ttfb":94,"transferSize":44102,"resourceTransferSize":701455,"lcp":610,"cls":0.02,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]},
          {"url":"https://example.com/blog/","redirectedFrom":[],"viewport":"1920x1080","status":200,"visits":1,"loadTime":580,"domContentLoaded":421,"ttfb":83,"transferSize":39417,"resourceTransferSize":655210,"lcp":520,"cls":0.01,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]},
          {"url":"https://example.com/contact/","redirectedFrom":[],"viewport":"1920x1080","status":200,"visits":1,"loadTime":701,"domContentLoaded":503,"ttfb":79,"transferSize":35560,"resourceTransferSize":590120,"lcp":480,"cls":0,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]},
          {"url":"https://example.com/","redirectedFrom":[],"viewport":"375x812","status":200,"visits":1,"loadTime":640,"domContentLoaded":470,"ttfb":90,"transferSize":41210,"resourceTransferSize":612770,"lcp":590,"cls":0.03,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]},
          {"url":"https://example.com/blog/","redirectedFrom":[],"viewport":"375x812","status":200,"visits":1,"loadTime":602,"domContentLoaded":440,"ttfb":85,"transferSize":39417,"resourceTransferSize":590330,"lcp":560,"cls":0.02,"vitalsSettled":true,"console":[{"level":"error","text":"Analytics: dataLayer not initialised, 3 events dropped","source":"https://analytics.example.net/tag.js"}],"network":[]}
        ]
    assert:
      - type: javascript
        value: 'output.issues.low.some((finding) => /analytics/i.test(JSON.stringify(finding))) && output.issues.critical.length + output.issues.high.length + output.issues.medium.length === 0'

  - description: The same third-party analytics console error on local is not a finding
    vars:
      environment: local
      rows: *analytics-rows
    assert:
      - type: javascript
        value: 'Object.values(output.issues).every((findings) => findings.length === 0)'

