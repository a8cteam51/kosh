description: functional-design
config:
  - prompts: [functional-design]
    assert:
      - type: skill-used
        value: functional-design
tests:
  - description: WCAG cited for contrast only, /kosh:a11y recommended for the rest
    vars:
      request: |
        During desktop testing on the About page, https://example.com/about/,
        you observed two problems:

        1. Six content images have no alt text.
        2. The Section 1.5 contrast script flagged footer body text
           (16px, weight 400) at a ratio of 3.2 against a threshold of 4.5.
           You saved a screenshot of the footer at
           kosh-reports/screenshots/about-footer-desktop.png.

        Write both findings as they would appear in the report, following the
        skill's rules about WCAG citations and recommendations.
    options:
      # Grade only the report entries: commentary around them can name the criterion it chose not to cite.
      transform: '[...output.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map((block) => block[1]).join("\n")'
    assert:
      - type: contains
        value: '1.4.3'
      - type: not-contains
        value: '1.1.1'
      - type: contains
        value: 'kosh:a11y'

  - description: Markup-category image finding recommends a sizes fix, not a re-upload
    vars:
      request: |
        The Section 1.4 image resolution script returned this result on the
        homepage:

        {
          "src": "hero-banner.jpg",
          "naturalSize": "485x303px",
          "renderedCSS": "800x500px",
          "neededForCrisp": "1600x1000px (2x DPR)",
          "resolutionRatio": 0.3,
          "status": "flag",
          "diagnosisCategory": "markup",
          "largestSrcsetCandidate": "1600w",
          "sizesAttr": "(max-width: 1024px) 485px, 485px"
        }

        Answer in three lines:
        1. MARKUP or SOURCE, naming which category owns the fix.
        2. YES or NO: does the fix change the page markup?
        3. The one-sentence recommended fix as it would appear in the report.
    assert:
      - type: regex
        value: '^[\s*_#>\d.)]*MARKUP\b'
      - type: regex
        value: '^[^\n]*\n[\s*_#>\d.)]*YES\b'
      - type: icontains
        value: sizes

  - description: Source-category image finding points at the asset, not the markup
    vars:
      request: |
        The Section 1.4 image resolution script returned this result on the
        homepage:

        {
          "src": "team-photo.jpg",
          "naturalSize": "768x480px",
          "renderedCSS": "800x500px",
          "neededForCrisp": "1600x1000px (2x DPR)",
          "resolutionRatio": 0.48,
          "status": "flag",
          "diagnosisCategory": "source",
          "largestSrcsetCandidate": "768w",
          "sizesAttr": "100vw"
        }

        Answer in three lines:
        1. MARKUP or SOURCE, naming which category owns the fix.
        2. YES or NO: does the fix change the page markup?
        3. The one-sentence recommended action as it would appear in the report.
    assert:
      - type: regex
        value: '^[\s*_#>\d.)]*SOURCE\b'
      - type: regex
        value: '^[^\n]*\n[\s*_#>\d.)]*NO\b'
      - type: regex
        value: '([Uu]pload|[Oo]riginal|[Gg]enerator)'

  - description: Request-category image finding fixes the requested size, not the upload
    vars:
      request: |
        The Section 1.4 image resolution script returned this result on a
        blog post:

        {
          "src": "related-thumb.jpg?resize=350%2C200&ssl=1",
          "naturalSize": "350x200px",
          "renderedCSS": "305x172px",
          "neededForCrisp": "610x344px (2x DPR)",
          "resolutionRatio": 0.57,
          "status": "flag",
          "diagnosisCategory": "request",
          "largestSrcsetCandidate": "none",
          "sizesAttr": "missing"
        }

        Answer in three lines:
        1. REQUEST, MARKUP or SOURCE, naming which category owns the fix.
        2. YES or NO: does this evidence alone justify recommending a re-upload?
        3. The one-sentence recommended fix as it would appear in the report.
    assert:
      - type: regex
        value: '^[\s*_#>\d.)]*REQUEST\b'
      - type: regex
        value: '^[^\n]*\n[\s*_#>\d.)]*NO\b'
      - type: regex
        value: '([Tt]emplate|[Bb]lock|[Rr]equest)'

  - description: Request-category finding still owns the fix when the CDN rounded a pixel off the requested size
    vars:
      request: |
        The Section 1.4 image resolution script returned this result on a
        blog post:

        {
          "src": "workflow-diagram.png?w=1024",
          "naturalSize": "1023x644px",
          "renderedCSS": "710x447px",
          "neededForCrisp": "1420x894px (2x DPR)",
          "resolutionRatio": 0.72,
          "status": "flag",
          "diagnosisCategory": "request",
          "largestSrcsetCandidate": "none",
          "sizesAttr": "missing"
        }

        Answer in three lines:
        1. REQUEST, MARKUP or SOURCE, naming which category owns the fix.
        2. YES or NO: does this evidence alone justify recommending a re-upload?
        3. The one-sentence recommended fix as it would appear in the report.
    assert:
      - type: regex
        value: '^[\s*_#>\d.)]*REQUEST\b'
      - type: regex
        value: '^[^\n]*\n[\s*_#>\d.)]*NO\b'
      - type: regex
        value: '([Tt]emplate|[Bb]lock|[Rr]equest)'

  - description: Off-site links go through the link checker, in one call, single-quoted, never opened
    vars:
      request: |
        You have finished the journeys and the mobile checks on https://example.com/.
        The footer, on every page you visited, has three icon links:

        - Instagram: https://www.instagram.com/example/
        - Facebook: https://www.facebook.com/example/
        - LinkedIn: https://www.linkedin.com/company/example/

        The About page, https://example.com/about/, also links to a partner:
        https://partner.example.org/programs/?ref=example&utm_source=site

        You need to verify these links aren't broken and lead to the intended
        destinations. Give every command or browser tool call you would run for
        this in one fenced code block, one per line, and nothing else in the block.
    options:
      # Grade only the commands: commentary around them can name the tools it chose not to use.
      transform: '[...output.matchAll(/```[a-z]*\s*([\s\S]*?)```/g)].map((block) => block[1]).join("\n").replace(/\\\n/g, " ")'
    assert:
      - type: javascript
        value: '(output.match(/check-links\.js/g) || []).length === 1'
      - type: javascript
        value: |
          const line = output.split('\n').find((l) => l.includes('check-links.js')) || '';
          return ['instagram.com', 'facebook.com', 'linkedin.com', 'partner.example.org'].every((host) => line.includes(host));
      - type: regex
        value: "'https://partner\\.example\\.org/[^']*&[^']*'"
      - type: not-icontains
        value: curl
      - type: not-regex
        value: 'browser_(navigate|click|tabs)'

  - description: A bot-wall status from the link checker is unverified, and nothing is opened to find out
    vars:
      request: |
        After the journeys on https://example.com/, you ran kosh's link checker
        on the site's off-site links. It printed:

        200 https://www.instagram.com/example/
        400 https://www.facebook.com/example/
        999 https://www.linkedin.com/company/example/
        404 https://partner.example.org/old-page/

        For each link, give one line: the URL, then OK, UNVERIFIED or BROKEN.
        Then one line starting `FURTHER STEP:` with any further step you would
        take to verify the UNVERIFIED links, or `none`.
    assert:
      - type: regex
        value: 'facebook\.com/example/[^\n]*UNVERIFIED'
      - type: regex
        value: 'linkedin\.com/company/example/[^\n]*UNVERIFIED'
      - type: regex
        value: 'partner\.example\.org/old-page/[^\n]*BROKEN'
      - type: javascript
        value: |
          const step = output.match(/FURTHER STEP:\**\s*(.*)/i);
          return Boolean(step) && (/^\W*none\b/i.test(step[1]) || !/browser|navigate|click|curl|fetch|open|visit|load/i.test(step[1]));

  - description: The off-site rule doesn't stop fetching a CDN image's original to check its real size
    vars:
      request: |
        The Section 1.4 image resolution script flagged the homepage hero on
        https://example.com/ with `diagnosisCategory` `request`. Its picked src is
        https://i0.wp.com/example.com/wp-content/uploads/2026/10/hero.jpg?resize=768%2C512&ssl=1,
        served from the image CDN host i0.wp.com, not example.com.

        Before writing that the source asset is too small, may you fetch the
        original with the resize parameters stripped,
        https://i0.wp.com/example.com/wp-content/uploads/2026/10/hero.jpg, to check
        its real dimensions? Answer YES or NO first, then one sentence why.
    assert:
      - type: regex
        value: '^[\s*_#>\d.)]*YES\b'
