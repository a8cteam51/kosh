description: Regression checks for the kosh skills' decision rules

prompts:
  - label: functional-design
    raw: |
      You are reviewing how the `functional-design` skill directs a QA tester
      to act in a specific scenario. Load the `functional-design` skill with
      the Skill tool, then answer from its guidance alone. Do not launch a browser, use Playwright, or modify any
      files — this is a knowledge check about the skill's rules, not a test
      run, so the skill's browser-automation requirement does not apply here.

      {{request}}

      Answer briefly with exactly what was requested.

  - label: performance
    raw: |
      You are reviewing how the `performance` skill directs a QA tester to
      judge what a run recorded. Load the `performance` skill with the Skill
      tool, then answer from its guidance alone. Do not launch a browser, use
      Playwright, or modify any files — this is a knowledge check about the
      skill's rules, not a test run, so the skill's browser-automation and
      report steps do not apply here.

      The run tested https://example.com/ as a {{environment}} site. It loaded
      five pages from a cold browser at 1920x1080, then two of them again at
      375x812, each once. After the last page,
      `node scripts/page-capture.js summary https://example.com/ https://example.com/about/ https://example.com/blog/hello-world/ https://example.com/blog/ https://example.com/contact/`
      printed:

      {{rows}}
      Every page given has a captured visit.
      {{note}}

      Write the report's `issues` and `explorationPass` as you would for this
      run, as one fenced JSON block shaped
      `{ "issues": { "critical": [], "high": [], "medium": [], "low": [] }, "explorationPass": [] }`.
      Answer briefly with exactly what was requested.

providers:
  - id: anthropic:claude-agent-sdk
    label: Opus 5
    config:
      model: claude-opus-5
      effort: xhigh
      working_dir: ./.workspaces/current
      setting_sources: ['project']
      skills: &evaluated-skills ['functional-design', 'performance']
      disallowed_tools: ['Read', 'Grep', 'Glob', 'Bash']
      permission_mode: dontAsk
      apiKeyRequired: false
      persist_session: false
  - id: anthropic:claude-agent-sdk
    label: Opus 5.5
    config:
      model: claude-opus-5-5
      effort: xhigh
      working_dir: ./.workspaces/current
      setting_sources: ['project']
      skills: *evaluated-skills
      disallowed_tools: ['Read', 'Grep', 'Glob', 'Bash']
      permission_mode: dontAsk
      apiKeyRequired: false
      persist_session: false

# Per-skill defaults live in scenarios, since defaultTest applies to every skill's cases.
scenarios:
  - file://tests/functional-design.yaml
  - file://tests/performance.yaml

evaluateOptions:
  maxConcurrency: 2

outputPath:
  - results/evals.html
  - results/raw/evals.json
